version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: fotnep-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: fotnep
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fotnep-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: fotnep-backend
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://root:password@mongodb:27017/fotnep
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your_secret_key
      ML_SERVICE_URL: http://ml-service:8000
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/backend/src
    command: npm run dev --workspace=backend

  ml-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.ml-service
    container_name: fotnep-ml-service
    environment:
      MONGODB_URI: mongodb://root:password@mongodb:27017/fotnep
      ML_SERVICE_PORT: 8000
      LOG_LEVEL: info
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    volumes:
      - ./services/ml-service:/app
      - ./data:/data
      - ml_models:/app/saved_models

  frontend:
    image: node:20-alpine
    container_name: fotnep-frontend
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend

volumes:
  mongodb_data:
  redis_data:
  ml_models:

networks:
  default:
    name: fotnep-network
